","file":"backend/work-portal-api/src/main/java/com/platform/portal/api/GlobalExceptionHandler.java","line":45,"msg":"예외 매핑이 설계와 다르지만 설계가 미결정. 조회 실패: orElseThrow() 8곳 → NoSuchElementException → 500, orElseThrow(IllegalArgumentException) 47곳 → 400 (아키텍처_표준 제안 404). 상태 전환 불가: IllegalStateException 9곳 → 500 (제안 409). 권한: AccessDeniedException → 403 (적합). DEC-AS-08 이 \"재결정 — L2\" 로 열려 있어 어느 쪽이 맞는지 판정할 기준이 없음","evidence":"GlobalExceptionHandler.java:45 \"@ExceptionHandler(Exception.class)\" → 500 · architecture.md DEC-AS-08 \"**재결정** — L2\" · 아키텍처_표준 4절 \"[제안] 404 조회 실패, 409 상태 전환 불가\"","relatedFindings":["C2","C3","C4"],"fix":"rsp-design-arch (DEC-AS-08 확정) → rsp-dev-spec"},{"id":"J3","rule":"J-03","sev":"오류","verdict":"위반","file":"backend/work-portal-api/src/main/java/com/platform/portal/domain/request/service/ChangeRequestService.java","line":257,"msg":"삼킨 예외 중 허용 범위 밖 2종. ① 변경요청 삭제 시 첨부 파일 삭제 IOException 을 로그 없이 무시 → DB 행은 지워지고 파일은 남는데 아무 기록이 없음. ② To-Do JSON 컨버터 4개가 파싱 실패 시 빈 리스트를 조용히 반환 → 저장된 체크항목·링크·작업기록이 화면에서 사라져도 원인을 알 수 없음. 외부 연동(알림·동기화) 삼킴이 아니라 본 처리 데이터에 관한 것이라 \"기록 후 진행\" 예외에 해당하지 않음. JwtTokenProvider.validateToken 의 catch 는 검증 결과를 false 로 돌려주는 패턴이라 허용(J6)","evidence":"ChangeRequestService.java:257 \"catch (IOException ignored) {}\" · CheckItemListConverter.java:22 catch → \"return new ArrayList\u003c>()\" (로그 없음) · 아키텍처_표준 5절 \"외부 연동 실패 — 본 처리는 진행 … 로그 없는 삼킴 금지\"","relatedFindings":["C1","C21","C22","C23","C24"],"fix":"rsp-dev-spec"},{"id":"J4","rule":"J-04","sev":"오류","verdict":"위반","file":"backend/work-portal-api/src/main/java/com/platform/portal/api/AuthController.java","line":27,"msg":"레이어 위반 2건(AuthController·RedmineController 의 Repository 직접 주입)과 MenuPermissionService.seedDefaults 의 @PostConstruct+@Transactional 은 현행분석서 11절 \"레이어 예외\"에 이미 기록된 기존 부채. 금지 사항이라 허용하지 않되 이번 변경으로 생긴 것이 아니므로 우선순위 낮음. AuthController.me 는 UserService 에 조회 메서드 하나를 추가하면 해소되고, seedDefaults 는 ApplicationRunner(DataInitializer 와 같은 방식)로 옮기면 됨","evidence":"AuthController.java:27 \"pri   // 머리
  h.push(`<h1>${esc(m.projectName)} — 코드 점검</h1>`);
  h.push(`<div class="meta"><span>기준일 <b>${esc(m.date)}</b></span><span>보고서 버전 <b>${esc(m.version)}</b></span><span>작성자 <b>${esc(D.author)}</b></span><span>원천 <code>${esc(D.source)}</code></span><span>생성 <b>${esc(D.generated)}</b></span><span>대상 <b>${esc((m.modules || []).map((x) => `${x.name}(${x.kind}, ${x.files}파일)`).join(' · '))}</b></span></div>`);

  // 타일
  h.push('<div class="tiles">');
  for (const s of S) h.push(`<div class="tile" data-s="${s}"><div class="k">${s}</div><div class="v">${cnt(s)}</div><div class="d">${SD[s]}</div></div>`);
  h.push(`<div class="tile" data-s="judge"><div class="k">판단 검사</div><div class="v">${J.length ? `${jc['위반'] || 0}` : '—'}</div><div class="d">${J.length ? `위반 ${jc['위반'] || 0} · 허용 ${jc['허용'] || 0} · 보류 ${jc['보류'] || 0}` : '미실시'}</div></div>`);
  if (D.diff) h.push(`<div class="tile" data-s="diff"><div class="k">지난 점검 대비</div><div class="v">${D.diff.resolved.length}<span style="font-size:13px;font-weight:400"> 해소</span></div><div class="d">신규 ${D.diff.added.length} · 잔존 ${D.diff.remaining} · 기준 ${esc(D.diff.prevDate || '?')}</div></div>`);
  h.push('</div>');
  const bars = S.slice(0, 2);
  const bt = bars.reduce((a, s) => a + cnt(s), 0);
  h.push('<div class="bar">' + bars.map((s) => `<span style="width:${bt ? cnt(s) / bt * 100 : 0}%;background:${SC[s]}" title="${s} ${cnt(s)}"></span>`).join('') + '</div>');
  h.push('<div class="legend">' + S.map((s) => `<span><i style="background:${SC[s]}"></i>${s} ${cnt(s)}</span>`).join('') + (rows.some((r) => r.verdict === '허용') ? `<span class="muted">허용 판정 ${rows.filter((r) => r.verdict === '허용').length}건은 집계에서 뺌</span>` : '') + '</div>');
  h.push('<div class="rule"><b>이 보고서는 고치지 않습니다.</b> 오류·경고는 8.요건요청서(유형: 개선) → <code>/rsp-dev-spec</code> 으로 넘깁니다. 오류 응답 체계처럼 설계 결정이 먼저인 것은 <code>/rsp-design-arch</code> 가 앞섭니다. 구현 직후 리뷰라면 <code>--prev</code> 로 신규만 봅니다. 규칙과 심각도 기준은 <a href="#rules">부록</a>.</div>');

  h.push(`<div class="tabs noprint" role="tablist"><button role="tab" data-tab="findings" aria-selected="true">발견 사항</button><button role="tab" data-tab="actions" aria-selected="false">조치 제안</button></div>`);

  // ===== 탭 1: 발견 사항 =====
  h.push('<section class="tab on" id="tab-findings">');
  // 1. 모듈별 집계
  const mods = [...new Set(rows.map((r) => r.module))];
  h.push('<h2>1. 모듈별 집계<small>허용 판정 제외</small></h2><div class="card"><table><thead><tr><th>모듈</th>' + S.map((s) => `<th class="n">${s}</th>`).join('') + '<th class="n">합계</th></tr></thead><tbody>');
  for (const md of mods) { const list = rows.filter((r) => r.module === md && r.verdict !== '허용'); h.push(`<tr><td>${esc(md)}</td>${S.map((s) => `<td class="n">${list.filter((r) => r.sev === s).length}</td>`).join('')}<td class="n">${list.length}</td></tr>`); }
  h.push(`<tr class="total"><td>전체</td>${S.map((s) => `<td class="n">${cnt(s)}</td>`).join('')}<td class="n">${total}</td></tr></tbody></table></div>`);

  // 2. 패턴 검사 발견
  const ruleIds = [...new Set(rows.map((r) => r.rule))].sort();
  h.push('<h2>2. 패턴 검사 발견<small>scripts/check-code.js · 규칙은 부록</small></h2><div class="card"><div class="toolbar noprint">'
    + `<select id="fs"><option value="">심각도 전체</option>${S.map((s) => `<option>${s}</option>`).join('')}</select>`
    + `<select id="fm"><option value="">모듈 전체</option>${mods.map((x) => `<option>${esc(x)}</option>`).join('')}</select>`
    + `<select id="fr"><option value="">규칙 전체</option>${ruleIds.map((x) => `<option>${esc(x)}</option>`).join('')}</select>`
    + '<label><input type="checkbox" id="fv" checked> 허용 판정 숨김</label>'
    + '<input id="fq" type="search" placeholder="파일·내용 검색"><span class="count" id="fc"></span></div>'
    + '<table><colgroup><col style="width:4%"><col class="w-s"><col style="width:8%"><col style="width:9%"><col class="w-loc"><col><col class="w-src"><col class="w-fix"></colgroup><thead><tr><th>#</th><th>심각도</th><th>규칙</th><th>모듈</th><th>위치</th><th>내용</th><th>출처</th><th>고칠 스킬</th></tr></thead><tbody id="fbody"></tbody></table>'
    + '<div class="note">같은 규칙·같은 파일은 한 행으로 묶고 줄 번호를 나열합니다. 위치를 누르면 파일이 열립니다(저장소를 같은 PC 에 받아 둔 경우). 허용 판정은 판단 검사 J-06 에서 설계 문서의 현행 결정·테스트 전용으로 확인한 것입니다.</div></div>');

  // 3. 판단 검사
  h.push('<h2>3. 판단 검사<small>스킬이 코드·설계 문서를 읽고 판정 · J-01 ~ J-06</small></h2><div class="card">');
  if (!J.length) h.push('<div class="empty">(미실시) 스킬이 references/규칙.md 의 J-01 ~ J-06 을 수행한 뒤 data.json <code>judgements</code> 에 적고 <code>--render</code> 로 다시 만듭니다.</div>');
  else {
    h.push('<table><colgroup><col style="width:4%"><col class="w-s"><col style="width:6%"><col style="width:6%"><col class="w-loc"><col><col class="w-ev"><col class="w-fix"></colgroup><thead><tr><th>#</th><th>심각도</th><th>규칙</th><th>판정</th><th>위치</th><th>판단</th><th>근거 (인용)</th><th>고칠 스킬</th></tr></thead><tbody>');
    J.forEach((j, i) => h.push(`<tr><td><code>${esc(j.id || 'J' + (i + 1))}</code></td><td>${j.sev ? badge(j.sev) : '<span class="muted">-</span>'}</td><td>${esc(j.rule)}</td><td>${vbadge(j.verdict)}</td><td>${j.file ? `<span class="loc" title="${esc(j.file)}">${esc(shortPath(j.file))}${j.line ? ':' + esc(j.line) : ''}<span class="full">${esc(j.file)}</span></span>` : '<span class="muted">-</span>'}</td><td>${esc(j.msg)}${j.relatedFindings && j.relatedFindings.length ? `<div class="small">관련 발견: ${j.relatedFindings.map((x) => `<code>${esc(x)}</code>`).join(' ')}</div>` : ''}</td><td>${j.evidence ? `<code>${esc(j.evidence)}</code>` : '<span class="muted">-</span>'}</td><td>${esc(j.fix || '')}</td></tr>`));
    h.push('</table>');
  }
  h.push('</div></section>');

  // ===== 탭 2: 조치 제안 =====
  h.push('<section class="tab" id="tab-actions">');
  h.push('<h2>4. 조치 제안<small>오류 → 경고 · 같은 규칙·모듈은 요건요청서 한 건</small></h2><div class="card">');
  if (!A.length) h.push('<div class="empty">(미실시) 스킬이 판단 검사 뒤 data.json <code>actions</code> 에 적습니다.</div>');
  else {
    h.push('<table><thead><tr><th>순서</th><th>제목</th><th>발견 사항</th><th>먼저 할 것</th><th>부를 스킬</th><th>입력 예</th></tr></thead><tbody>');
    A.forEach((a, i) => h.push(`<tr><td class="c">${esc(a.order || i + 1)}</td><td>${esc(a.title)}${a.note ? `<div class="small">${esc(a.note)}</div>` : ''}</td><td>${(a.findings || []).map((x) => `<code>${esc(x)}</code>`).join(' ')}</td><td>${esc(a.first || '')}</td><td>${esc(a.skill)}</td><td><code>${esc(a.input || '')}</code></td></tr>`));
    h.push('</table>');
  }
  h.push('<div class="note">참고(info)는 조치 표에 넣지 않습니다. 환경변수·서버 설정처럼 코드 밖의 일은 "사람"으로 적고 담당은 비워 둡니다.</div></div>');

  // 5. 지난 점검 대비
  h.push('<h2>5. 지난 점검 대비</h2><div class="card">');
  if (!D.diff) h.push('<div class="empty">비교 대상 없음 (--prev 로 이전 data.json 또는 git 리비전을 주면 신규·해소를 보여 줍니다).</div>');
  else {
    const added = rows.filter((r) => D.diff.added.includes(r.id));
    h.push(`<div class="note" style="border-top:0">기준 ${esc(D.diff.prevDate || '?')} · 신규 ${added.length} · 해소 ${D.diff.resolved.length} · 잔존 ${D.diff.remaining}</div>`);
    if (added.length) h.push('<ul class="plain">' + added.map((r) => `<li>${badge(r.sev)} <code>${esc(r.id)}</code> ${esc(r.rule)} — ${esc(r.file)} · ${esc(r.msg)}</li>`).join('') + '</ul>');
    if (D.diff.resolved.length) h.push('<div class="note">해소</div><ul class="plain">' + D.diff.resolved.map((r) => `<li>${badge(r.sev)} ${esc(r.rule)} — ${esc(r.file)} · ${esc(r.msg)}</li>`).join('') + '</ul>');
  }
  h.push('</div>');

  // 6. 점검 이력
  h.push('<h2>6. 점검 이력</h2><div class="card">');
  if (!(D.history || []).length) h.push('<div class="empty">이력 없음</div>');
  else h.push('<table><thead><tr><th>날짜</th><th>내용</th></tr></thead><tbody>' + D.history.slice().reverse().map((x) => `<tr><td class="loc">${esc(x.date)}</td><td>${esc(x.note)}</td></tr>`).join('') + '</tbody></table>');
  h.push('</div></section>');

  // ===== 부록 =====
  h.push('<h2 id="scope">부록 — 점검 범위</h2><div class="card"><table><thead><tr><th>모듈</th><th>종류</th><th>경로</th><th class="n">파일 수</th></tr></thead><tbody>'
    + (m.modules || []).map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td><code>${esc(x.path)}</code></td><td class="n">${esc(x.files)}</td></tr>`).join('') + '</tbody></table>'
    + `<div class="note">테스트 디렉터리 ${esc(m.tests || '제외')} · 정적 점검만 하며 보안(비밀값·TLS·CORS·권한)은 rsp-check-security, 의존성 취약점은 rsp-check-vuln 몫입니다.</div></div>`);
  h.push('<h2 id="rules">부록 — 규칙과 심각도</h2><details class="card"><summary>규칙 목록 펼치기 (출처가 있는 규칙만 · 전체 정의는 skills/rsp-check-code/references/규칙.md)</summary><table><thead><tr><th>규칙</th><th>내용</th><th>기본 심각도</th><th>출처</th><th>고칠 스킬</th></tr></thead><tbody>'
    + (D.rules || []).map((r) => `<tr><td><code>${esc(r.id)}</code></td><td>${esc(r.title)}</td><td>${badge(r.sev)}</td><td>${esc(r.source)}</td><td>${esc(r.fix)}</td></tr>`).join('')
    + '</tbody></table><div class="note">심각도: 오류 = 컨벤션·표준 6절 금지 사항 위반 또는 동작 결함성. 경고 = 표의 규칙과 다름([관찰] 위반·[제안] 미채택). 참고 = 위반 아님.</div></details>');

  document.getElementById('app').innerHTML = h.join('');
  document.getElementById('foot').textContent = `rsp-check-code · 원천 ${D.source} · 이 파일은 날짜별 스냅샷입니다. 다시 점검하면 같은 약칭의 data.json 이 갱신되고 새 날짜의 HTML 이 생깁니다.`;

  // 탭
  document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.id === 'tab-' + b.dataset.tab));
  }));

  // 2절 필터
  const fs_ = document.getElementById('fs'), fm = document.getElementById('fm'), fr = document.getElementById('fr'), fv = document.getElementById('fv'), fq = document.getElementById('fq'), fc = document.getElementById('fc'), body = document.getElementById('fbody');
  function render() {
    const q = fq.value.trim().toLowerCase();
    const list = rows.filter((r) => (!fs_.value || r.sev === fs_.value) && (!fm.value || r.module === fm.value) && (!fr.value || r.rule === fr.value) && (!fv.checked || r.verdict !== '허용')
      && (!q || [r.file, r.msg, r.rule, (r.snippets || []).join(' ')].join(' ').toLowerCase().includes(q)));
    body.innerHTML = list.map((r) => `<tr class="${r.verdict === '허용' ? 'allowed' : ''}"><td><code>${esc(r.id)}</code></td><td>${badge(r.sev)}${r.verdict ? '<div>' + vbadge(r.verdict) + '</div>' : ''}</td><td class="loc">${esc(r.rule)}</td><td>${esc(r.module)}</td><td>${locLink(r)}</td><td>${esc(r.msg)}${(r.snippets || []).length ? `<code class="snip">${esc(r.snippets.join('\n'))}</code>` : ''}${r.note ? `<div class="small">${esc(r.note)}</div>` : ''}</td><td class="small">${esc(r.source)}</td><td>${esc(r.fix)}</td></tr>`).join('')
      || '<tr><td colspan="8" class="empty">조건에 맞는 발견 사항이 없습니다.</td></tr>';
    fc.textContent = `${list.length} / ${rows.length}건`;
  }
  [fs_, fm, fr, fv].forEach((el) => el.addEventListener('change', render));
  fq.addEventListener('input', render);
  render();
  window.addEventListener('beforeprint', () => document.querySelectorAll('details').forEach((d) => { d.open = true; }));
})();
</script>
</body>
</html>
