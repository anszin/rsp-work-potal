  document.querySelectorAll('.check input').forEach((cb) => {
    const i = cb.dataset.i; cb.checked = !!saved[i]; cb.nextElementSibling.classList.toggle('done', cb.checked);
    cb.addEventListener('change', () => { saved[i] = cb.checked; cb.nextElementSibling.classList.toggle('done', cb.checked); try { localStorage.setItem(key, JSON.stringify(saved)); } catch (e) { /* 저장 불가 환경 */ } });
  });
})();
</script>
</body>
</html>
